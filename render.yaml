services:
  - type: web
    name: syntrahub
    runtime: python
    region: oregon
    plan: free
    branch: master
    buildCommand: |-
      pip install -r backend/requirements.txt && \
      cd frontend && npm ci && npm run build
    startCommand: python run.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: sqlite:///backend/data/books_daily.db
      - fromKey: HF_TOKEN
      - fromKey: TELEGRAM_BOT_TOKEN
      - fromKey: SMTP_EMAIL
      - fromKey: SMTP_PASSWORD
      - fromKey: TWILIO_ACCOUNT_SID
      - fromKey: TWILIO_AUTH_TOKEN
      - fromKey: TWILIO_WHATSAPP_NUMBER
      - fromKey: STRIPE_KEY
      - fromKey: PAYPAL_KEY
      - fromKey: CRICAPI_KEY
    disk:
      name: data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
