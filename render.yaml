services:
  - type: web
    name: syntrahub
    runtime: python
    region: oregon
    plan: free
    branch: master
    buildCommand: |-
      pip install -r backend/requirements.txt && \
      cd frontend && npm ci && npm run build
    startCommand: python run.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: sqlite:///backend/data/books_daily.db
      - key: HF_TOKEN
      - key: TELEGRAM_BOT_TOKEN
      - key: SMTP_EMAIL
      - key: SMTP_PASSWORD
      - key: TWILIO_ACCOUNT_SID
      - key: TWILIO_AUTH_TOKEN
      - key: TWILIO_WHATSAPP_NUMBER
      - key: STRIPE_KEY
      - key: PAYPAL_KEY
      - key: CRICAPI_KEY
